version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: pizza_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pizza_delivery

  backend:
    build: ./backend
    container_name: pizza_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/pizza_delivery
      JWT_SECRET: your_super_secret_key_change_me
      JWT_EXPIRE: 30d
      CLIENT_URL: http://localhost:3000
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your_email@gmail.com
      EMAIL_PASS: your_app_password
      EMAIL_FROM: noreply@pizzadelivery.com
      ADMIN_EMAIL: admin@pizzadelivery.com
      RAZORPAY_KEY_ID: rzp_test_your_key
      RAZORPAY_KEY_SECRET: your_secret
      STOCK_THRESHOLD: 20
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: pizza_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_RAZORPAY_KEY_ID: rzp_test_your_key
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
